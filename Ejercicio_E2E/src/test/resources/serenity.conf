serenity {
  take.screenshots = AFTER_EACH_STEP
  test.root = "com.demoblaze.automation"
  logging = VERBOSE
  console.colors = true
}

headless.mode = false

webdriver {
  driver = chrome
  autodownload = true
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "remote-allow-origins=*",
        "test-type",
        "no-sandbox",
        "ignore-certificate-errors",
        "disable-infobars",
        "disable-gpu",
        "disable-default-apps",
        "disable-popup-blocking",
        "disable-dev-shm-usage",
        "disable-extensions"
      ]
    }
  }
}

environments {
  default {
    webdriver.base.url = "https://www.demoblaze.com"
  }
}

